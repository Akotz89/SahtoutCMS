name: PHP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax
        run: |
          for f in includes/session.php includes/admin_sidebar.php includes/header.php includes/footer.php includes/account_username.php index.php pages/account.php pages/admin/resources.php pages/admin/users.php pages/login.php pages/register.php tests/*.php; do php -l "$f"; done
      - name: Offline account checks
        run: |
          php tests/account_username_test.php
          php tests/admin_guard_test.php
          php tests/register_test.php
