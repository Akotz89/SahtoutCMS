name: PHP syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked PHP files
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l
      - name: Check account behavior
        run: |
          php tests/account_username_test.php
          php tests/admin_guard_test.php
          php tests/register_test.php
